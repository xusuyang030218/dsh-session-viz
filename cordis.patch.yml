# dsh-session-viz bundle patch：插入 host 半。
#   dsh-session-viz          主 host 半（main；仅注册一个 info 工具，任何 profile 可用）
#   dsh-session-viz-web      AgentTrace 数据路由半（./web；依赖 webServer，仅 web profile 激活）
#   dsh-session-viz-map-web  会话图快照路由半（./map-web；依赖 webServer + sessionQuery）
# 浏览器半（会话头部「◈ AgentTrace」按钮 + 三层查看器 + 「会话图」标签页）由官方
# client-modules 扫描 dsh.client 声明后，以 /plugins/dsh-session-viz/client.js 自动供给浏览器。
- insert:
    - id: dsh-session-viz
      name: dsh-session-viz
      config:
        sessionsPath: !!js dshHomePath('sessions')

    - id: dsh-session-viz-web
      name: 'dsh-session-viz/web'
      config:
        sessionsPath: !!js dshHomePath('sessions')

    - id: dsh-session-viz-map-web
      name: 'dsh-session-viz/map-web'
      config:
        maxSessions: 128
        maxEventsPerSession: 20000
